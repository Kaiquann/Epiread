services:
  - type: web
    name: epiread
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: PORT
        value: 10000
      - key: ConnectionStrings__DBConnection
        sync: false
      - key: InitialAccount__FirstName
        sync: false
      - key: InitialAccount__LastName
        sync: false
      - key: InitialAccount__UserName
        sync: false
      - key: InitialAccount__Email
        sync: false
      - key: InitialAccount__Password
        sync: false
      - key: Smtp__Host
        sync: false
      - key: Smtp__Port
        value: 587
      - key: Smtp__Username
        sync: false
      - key: Smtp__Password
        sync: false
      - key: Smtp__From
        sync: false
      - key: Smtp__Name
        value: EpiRead System
      - key: CfCaptcha__SiteKey
        sync: false
      - key: CfCaptcha__SecretKey
        sync: false
      - key: IpInfo__Token
        sync: false
      - key: Dropbox__RefreshToken
        sync: false
      - key: Dropbox__ClientId
        sync: false
      - key: Dropbox__ClientSecret
        sync: false
      - key: Gemini__ApiKey
        sync: false
      - key: Gemini__Model
        value: models/gemini-2.5-flash-lite
      - key: Gemini__IsVertex
        value: false
      - key: Gemini__ExpressMode
        value: false
      - key: Gemini__EnableGrounding
        value: true
      - key: Gemini__GroundingThreshold
        value: 0.7
      - key: Gemini__GroundingMode
        value: ALWAYS
